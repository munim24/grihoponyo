{% extends 'base.html' %}

{% block content %}
<div style="max-width:600px; margin:40px auto; padding:30px; background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(63,114,175,0.10);">
    <h2 style="text-align:center; margin-bottom:5px; color:var(--brand-dark);">Contact Us</h2>
    <p style="text-align:center; color:#666; margin-bottom:20px;">We'd love to hear from you.</p>

    {% if messages %}
        {% for message in messages %}
            <div style="background:#f0faf4; color:var(--brand-dark); padding:12px; border-radius:6px; margin-bottom:15px; border:1px solid var(--brand-light-green);">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:15px;">
            <label>Name</label><br>
            <input type="text" name="name" required style="width:100%; padding:10px; border:1px solid #cfdedb; border-radius:5px; margin-top:5px;">
        </div>
        <div style="margin-bottom:15px;">
            <label>Email</label><br>
            <input type="email" name="email" required style="width:100%; padding:10px; border:1px solid #cfdedb; border-radius:5px; margin-top:5px;">
        </div>
        <div style="margin-bottom:20px;">
            <label>Message</label><br>
            <textarea name="message" rows="5" required style="width:100%; padding:10px; border:1px solid #cfdedb; border-radius:5px; margin-top:5px;"></textarea>
        </div>
        <button type="submit" style="width:100%; background:var(--brand-dark); color:#fff; padding:12px; border:none; border-radius:20px; font-size:16px; cursor:pointer;">
            Send Message
        </button>
    </form>

    <div style="margin-top:25px; text-align:center; color:#555; font-size:14px;">
        📞 01969914777 &nbsp;|&nbsp; ✉️ shop.grihoponyo@gmail.com
    </div>
</div>
{% endblock %}
