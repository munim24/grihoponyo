{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
.category-page-header {
    text-align: center;
    max-width: 1260px;
    margin: 30px auto 20px;
    padding: 0 40px;
}
.category-page-header h2 {
    font-size: 26px;
    color: #222;
    display: inline-block;
    padding-bottom: 10px;
    border-bottom: 3px solid #ff6b6b;
}
.category-empty {
    text-align: center;
    padding: 60px 20px;
    color: #777;
    font-size: 15px;
}

/* =========================================
   PRODUCT CARD CART ACTIONS (same as home.html)
   ========================================= */

.cart-action {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-top: 8px;
}

.cart-action .add-to-cart-btn {
    flex: 1;
    width: auto;
    height: 34px;
    padding: 0 6px;
    border: 1px solid var(--brand-dark);
    border-radius: 7px;
    background: #fff;
    color: var(--brand-dark);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.1;
    cursor: pointer;
}

.cart-action .buy-now-form {
    flex: 1;
    margin: 0;
    padding: 0;
}

.cart-action .buy-now-btn {
    width: 100%;
    height: 34px;
    padding: 0 6px;
    border: 1px solid var(--brand-dark);
    border-radius: 7px;
    background: var(--brand-dark);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.1;
    cursor: pointer;
}

.cart-action .add-to-cart-btn:hover {
    background: var(--brand-dark);
    color: #fff;
}

.cart-action .buy-now-btn:hover {
    background: var(--brand-dark-hover);
    border-color: var(--brand-dark-hover);
}

.cart-action .qty-stepper {
    flex: 1;
    min-width: 0;
    height: 38px;
    display: flex;
    align-items: center;
    border-radius: 7px;
    overflow: hidden;
}

.cart-action .qty-stepper button {
    width: 28px;
    height: 100%;
    flex-shrink: 0;
    border: none;
    font-size: 17px;
    cursor: pointer;
}

.cart-action .qty-label {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 12px;
    white-space: nowrap;
}

@media (max-width: 600px) {
    .category-page-header { padding: 0 16px; margin: 20px auto 10px; }
    .category-page-header h2 { font-size: 20px; }
}
</style>

<div class="category-page-header">
    <h2><b>🎁 Combo Offers</b></h2>
</div>

<div class="grid">
    {% for product in products %}
        {% include 'shop/includes/product_card.html' %}
    {% empty %}
        <p class="category-empty">এখনো কোনো Combo Offer নেই।</p>
    {% endfor %}
</div>
{% endblock %}
