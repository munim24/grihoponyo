{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
.category-page-header {
    text-align: center;
    max-width: 1260px;
    margin: 30px auto 20px;
    padding: 0 40px;
}
.category-page-header h2 {
    font-size: 26px;
    color: #222;
    display: inline-block;
    padding-bottom: 10px;
    border-bottom: 3px solid #2e7d32;
}
.category-empty {
    text-align: center;
    padding: 60px 20px;
    color: #777;
    font-size: 15px;
}
@media (max-width: 600px) {
    .category-page-header { padding: 0 16px; margin: 20px auto 10px; }
    .category-page-header h2 { font-size: 20px; }
}
</style>

<div class="category-page-header">
    <h2><b>{{ category.name }}</b></h2>
</div>

<div class="grid">
    {% for product in products %}
        {% include 'shop/includes/product_card.html' %}
    {% empty %}
        <p class="category-empty">No products in this category yet.</p>
    {% endfor %}
</div>
{% endblock %}
